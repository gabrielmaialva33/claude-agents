<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background Circles -->
  <circle cx="150" cy="200" r="150" fill="#D6E3F3" opacity="0.6"/>
  <circle cx="380" cy="320" r="120" fill="#B8CAE8" opacity="0.5"/>
  
  <!-- Robot Body (Torso) -->
  <rect x="156" y="260" width="200" height="100" rx="20" fill="#5B9BED"/>
  
  <!-- Robot Head -->
  <rect x="176" y="120" width="160" height="120" rx="30" fill="#5B9BED"/>
  
  <!-- Antenna Base -->
  <rect x="246" y="80" width="20" height="50" fill="#2C4B7C"/>
