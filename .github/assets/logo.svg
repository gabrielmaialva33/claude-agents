<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#E8F0FE" opacity="0.8"/>
  <circle cx="150" cy="150" r="70" fill="#C3D9F9" opacity="0.5"/>
  
  <!-- Robot Body -->
  <rect x="50" y="80" width="100" height="80" rx="20" fill="#5B9BED"/>
  
  <!-- Robot Head -->
  <rect x="60" y="50" width="80" height="50" rx="15" fill="#5B9BED"/>
  
  <!-- Antenna -->
  <rect x="97" y="35" width="6" height="20" fill="#2C4B7C"/>
  <circle cx="100" cy="30" r="8" fill="#F9A825"/>
  
  <!-- Eyes -->
  <rect x="70" y="65" width="60" height="20" rx="10" fill="#2C4B7C"/>
  <circle cx="85" cy="75" r="7" fill="#F9A825"/>
  <circle cx="115" cy="75" r="7" fill="#F9A825"/>
  
  <!-- Mouth -->
  <path d="M 85 90 Q 100 95 115 90" stroke="#2C4B7C" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Arms -->
  <rect x="35" y="100" width="15" height="40" rx="7" fill="#2C4B7C"/>
  <rect x="150" y="100" width="15" height="40" rx="7" fill="#2C4B7C"/>
  
  <!-- Body Details -->
  <rect x="75" y="110" width="50" height="30" rx="5" fill="#1565C0"/>
  
  <!-- Laptop -->
  <rect x="45" y="140" width="110" height="40" rx="5" fill="#1565C0"/>
  <rect x="50" y="145" width="100" height="25" fill="#0D47A1"/>
  <circle cx="100" cy="157" r="5" fill="#3C4758"/>
</svg>